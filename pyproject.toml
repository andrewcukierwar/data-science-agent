[project]
name = "data-science-agent"
version = "0.1.0"
description = "A foundation for evidence-backed, multi-agent business analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai-agents>=0.20.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.59.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
